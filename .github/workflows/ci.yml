name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify jsdom available
        run: npx vitest --version && node -e "require('jsdom'); console.log('jsdom ok')"

      - name: Validate D1 API syntax and migration locally
        run: |
          node --check workers/ec-api/src/index.js
          node --check workers/ec-api/src/drive.js
          npx wrangler d1 migrations apply exam-cracker-db --local
          schema_output="$(npx wrangler d1 execute exam-cracker-db --local --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('student_profiles','course_catalog','subjects','course_subjects','drive_files','site_settings','feedback_threads','feedback_messages','notifications') ORDER BY name")"
          echo "$schema_output"
          for table in student_profiles course_catalog subjects course_subjects drive_files site_settings feedback_threads feedback_messages notifications; do
            grep -q "$table" <<<"$schema_output"
          done
          column_output="$(npx wrangler d1 execute exam-cracker-db --local --command="SELECT name FROM pragma_table_info('course_catalog')")"
          echo "$column_output"
          for column in parent_id subject_id sort_order; do
            grep -q "$column" <<<"$column_output"
          done

      - name: Validate Cloudflare media proxy JavaScript
        run: node --check workers/ec-content-api/src/index.js

      - name: Validate browser smoke test JavaScript
        run: |
          node --check .github/scripts/browser-smoke.mjs
          node --check .github/scripts/verify-public-env-bundle.mjs

      - name: Validate Cloudflare Pages proxy
        run: |
          node --check 'cloudflare-pages/functions/[[path]].js'
          node --check cloudflare-pages/functions/index.js
          node --check cloudflare-pages/stage-assets.mjs
          bash -n cloudflare-pages/build.sh
          node -e "const fs = require('node:fs'); const r = JSON.parse(fs.readFileSync('cloudflare-pages/public/_routes.json', 'utf8')); if (r.version !== 1 || !r.include.includes('/*') || r.exclude.length !== 0) process.exit(1); console.log('Pages proxy route template valid')"
          test ! -f cloudflare-pages/wrangler.toml
          grep -q 'EXAM_CRACKER_WEB' CLOUDFLARE_PAGES_DASHBOARD_ENV.md
          grep -q 'exam-cracker-web' CLOUDFLARE_PAGES_DASHBOARD_ENV.md
          echo "Pages uses dashboard-managed bindings; handoff documentation is present"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test -- --reporter=verbose

      - name: Production build (Next.js)
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        run: npm run build:cloudflare

      - name: Verify Pages static assets bypass Function routing
        run: |
          node cloudflare-pages/stage-assets.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const output = 'cloudflare-pages/public';
          const routes = JSON.parse(fs.readFileSync(path.join(output, '_routes.json'), 'utf8'));
          const requiredExcludes = ['/_next/static/*', '/icons/*', '/favicon.ico'];
          for (const pattern of requiredExcludes) {
            if (!routes.exclude.includes(pattern)) {
              throw new Error(`Pages route config is missing static exclusion: ${pattern}`);
            }
          }
          if (!fs.existsSync(path.join(output, '_next', 'static'))) {
            throw new Error('Pages output does not contain the Next.js static assets.');
          }
          const hasAsset = (dir) => fs.readdirSync(dir, { withFileTypes: true }).some((entry) => {
            const file = path.join(dir, entry.name);
            return entry.isDirectory() ? hasAsset(file) : /\\.(?:js|css)$/.test(entry.name);
          });
          if (!hasAsset(path.join(output, '_next', 'static'))) {
            throw new Error('Pages static asset directory contains no JS/CSS files.');
          }
          console.log(`Verified ${routes.exclude.length} Pages static-asset exclusions and generated JS/CSS output.`);
          NODE

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Check public config not containing secrets
        run: |
          echo "Checking for accidental secret commit..."
          ! grep -R "service_role" --include="*.ts" --include="*.tsx" --include="*.js" src/ || (echo "Found service_role in src — remove before commit" && exit 1)
          # Test fixtures legitimately name the env vars and the retired backend, so the
          # import/name scan covers production code; the credential-material scan below
          # covers every file including tests.
          ! grep -R --exclude-dir=__tests__ "SUPABASE_SERVICE_ROLE_KEY\|GOOGLE_SERVICE_ACCOUNT_JSON\|private_key" --include="*.ts" --include="*.tsx" --include="*.js" src/ || (echo "Found a server credential in src — remove before commit" && exit 1)
          ! grep -R --exclude-dir=__tests__ "supabase" --include="*.ts" --include="*.tsx" src/ || (echo "Supabase code is retired; remove the import" && exit 1)
          ! grep -R -e "-----BEGIN [A-Z ]*PRIVATE KEY-----" src/ || (echo "Found a PEM private key in src — remove before commit" && exit 1)
          ! grep -REn "AIza[0-9A-Za-z_-]{35}" src/ || (echo "Found a Google API key in src — remove before commit" && exit 1)
          test ! -d supabase || (echo "supabase/ source directory should not exist" && exit 1)

      - name: Verify Cloudflare web worker config is separate
        run: |
          test -f wrangler.toml
          grep -q 'exam-cracker-web' wrangler.toml
          test -f workers/ec-content-api/wrangler.toml
          grep -q 'ec-content-api' workers/ec-content-api/wrangler.toml
          test "$(grep -c '^name =' wrangler.toml)" -eq 1
          grep -q 'NEXT_PRIVATE_MINIMAL_MODE = "1"' wrangler.toml
          echo "✓ Worker configs separate and runtime compatibility flag is set"

      - name: Verify OpenNext config exists
        run: test -f open-next.config.ts && echo "✓ open-next.config.ts present"
