name: Update Exam Cracker Pages backend (manual only)

# Do not deploy as a side effect of a push or merge.
# The public site is the Cloudflare Pages project examcrack.pages.dev.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        run: |
          required=(NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub variable/secret: $name" >&2; exit 1; fi
          done
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyA1fiEviIdG5_yi7AcyxC3m9sec-AdkOfU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'darvo1.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'darvo1' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'darvo1.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '283467136948' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:283467136948:web:c66fd594827909eb3f7ce1' }}
          NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL || 'https://ec-content-api.arvinddara0290.workers.dev' }}

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyA1fiEviIdG5_yi7AcyxC3m9sec-AdkOfU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'darvo1.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'darvo1' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'darvo1.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '283467136948' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:283467136948:web:c66fd594827909eb3f7ce1' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-FMV79YMHBC' }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL || 'https://ec-content-api.arvinddara0290.workers.dev' }}
          NEXT_PUBLIC_ADMIN_EMAIL: arvinddarabishnoi@gmail.com
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED || 'true' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://examcrack.pages.dev' }}

      - name: Verify Firebase public config was inlined in client JavaScript
        env:
          EXPECTED_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyA1fiEviIdG5_yi7AcyxC3m9sec-AdkOfU' }}
        run: node .github/scripts/verify-public-env-bundle.mjs

      - name: Build OpenNext Cloudflare bundle
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyA1fiEviIdG5_yi7AcyxC3m9sec-AdkOfU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'darvo1.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'darvo1' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'darvo1.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '283467136948' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:283467136948:web:c66fd594827909eb3f7ce1' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-FMV79YMHBC' }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_MEDIA_PROXY_URL || 'https://ec-content-api.arvinddara0290.workers.dev' }}
          NEXT_PUBLIC_ADMIN_EMAIL: arvinddarabishnoi@gmail.com
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED || 'true' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://examcrack.pages.dev' }}

      - name: Update internal Pages backend Worker (exam-cracker-web)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      - name: Verify deployed website health
        env:
          HEALTH_URL: https://examcrack.pages.dev/login
        run: |
          test -n "$HEALTH_URL" || { echo "Set CLOUDFLARE_WEB_HEALTH_URL to the deployed /login URL" >&2; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$HEALTH_URL"

      - name: Install browser for client runtime verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify client hydration and app interaction in a real browser
        run: node .github/scripts/browser-smoke.mjs

      - name: Verify rendered app shell and JavaScript assets
        env:
          HEALTH_URL: https://examcrack.pages.dev/login
        run: |
          node --input-type=module <<'NODE'
          const configured = process.env.HEALTH_URL;
          if (!configured) throw new Error('HEALTH_URL is required');
          const loginUrl = new URL(configured);
          const rootUrl = new URL('/', loginUrl);
          const targets = [loginUrl.href, rootUrl.href];
          const fatalText = [
            'Exam Cracker needs a refresh',
            'The app shell failed to start',
          ];
          const assets = new Set();

          for (const target of targets) {
            const response = await fetch(target, { redirect: 'follow' });
            const html = await response.text();
            if (!response.ok) {
              throw new Error(`App route ${new URL(target).pathname} returned HTTP ${response.status}`);
            }
            const fatal = fatalText.find((marker) => html.includes(marker));
            if (fatal) {
              throw new Error(`Deployed HTML contains root error fallback on ${new URL(target).pathname}: ${fatal}`);
            }
            if (!html.includes('/_next/static/')) {
              throw new Error(`App route ${new URL(target).pathname} has no Next.js client assets`);
            }
            for (const match of html.matchAll(/(?:src|href)=["']([^"']*\/_next\/static\/[^"']+\.js(?:\?[^"']*)?)["']/g)) {
              assets.add(match[1].replaceAll('&amp;', '&'));
            }
          }

          if (assets.size === 0) throw new Error('No Next.js JavaScript bundles were found in rendered HTML');
          for (const path of [...assets].slice(0, 20)) {
            const assetUrl = new URL(path, loginUrl);
            const response = await fetch(assetUrl);
            if (!response.ok) {
              throw new Error(`Next.js JavaScript asset returned HTTP ${response.status}: ${assetUrl.pathname}`);
            }
            const body = await response.arrayBuffer();
            if (body.byteLength === 0) throw new Error(`Next.js JavaScript asset is empty: ${assetUrl.pathname}`);
          }
          console.log(`App shell smoke test passed: ${targets.length} routes and ${Math.min(assets.size, 20)} JavaScript assets`);
          NODE

